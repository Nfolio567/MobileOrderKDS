name: Build
on: push
jobs:
  cmake_build_ninja:
    name: "Build by CMake with Ninja"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install packages
        run: sudo apt update && sudo apt install build-essential cmake ninja-build
      - name: Install libxcb
        run: sudo apt update && sudo apt install libxcb1 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-render-util0 \
          libxcb-xinerama0 \
          libxcb-xkb1 \
          libxcb-shape0 \
          libxcb-randr0 \
          libxcb-render0 \
          libxcb-shm0 \
          libxcb-sync1 \
          libxcb-xfixes0 \
          libxcb-xinput0 \
          libxcb-cursor0 \
          libxkbcommon0 \
          libxkbcommon-x11-0
      - name: Install Qt6.11.2
        run: |
          curl -OL https://download.qt.io/official_releases/online_installers/qt-online-installer-linux-x64-online.run && \
          chmod +x ./qt-online-installer-linux-x64-online.run && \
          ./qt-online-installer-linux-x64-online.run \
          --root $HOME/Qt \
          --accept-licenses \
          --default-answer \
          --confirm-command \
          install qt.qt6.6111.linux_gcc_64
      - name: Export build files
        run: cmake -B build -G Ninja -DCMAKE_PREFIX_PATH="$HOME/Qt/6.11.2/gcc_64"
      - name: Check metatype.json
        run: |
          if [ ! -s "build/meta_types/qt6kds_metatypes.json" ]; then
            echo "{}" > build/meta_types/qt6kds_metatypes.json
          fi
      - name: Build
        run: cmake --build build
      - name: Upload runnable file to artifact
        uses: actions/upload-artifact@v7
        with: 
          name: KDS
          path: build/kds